
name: Update ORBITAL Space Data

on:
  schedule:
    - cron: "0,30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download satellite and space weather data
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p data

          # CelesTrak satellite data
          for group in stations starlink gps-ops weather geo science; do
            echo "Downloading ${group}..."

            curl -fLsS --retry 3 \
              "https://celestrak.org/NORAD/elements/gp.php?GROUP=${group}&FORMAT=tle" \
              -o "data/${group}.tle"
          done

          # NOAA solar wind plasma (new 2026 endpoint)
          curl -fLsS --retry 3 \
            "https://services.swpc.noaa.gov/json/rtsw/rtsw_wind_1m.json" \
            -o data/solar-wind.json

          # NOAA planetary K-index
          curl -fLsS --retry 3 \
            "https://services.swpc.noaa.gov/products/noaa-planetary-k-index.json" \
            -o data/planetary-k-index.json

          # NOAA GOES X-ray flares
          curl -fLsS --retry 3 \
            "https://services.swpc.noaa.gov/json/goes/primary/xray-flares-7-day.json" \
            -o data/xray-flares.json

          echo "All data downloaded successfully."

      - name: Save updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/

          if git diff --cached --quiet; then
            echo "No data changes detected."
          else
            git commit -m "Update satellite and space weather data"
            git push
          fi
