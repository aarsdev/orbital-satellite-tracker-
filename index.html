<script type="module">
import * as THREE from "three";
import {OrbitControls} from "three/addons/controls/OrbitControls.js";
import * as satellite from "satellite.js";

const $ = id => document.getElementById(id);

const canvas = $("globe");
const objects = [];

let selected = null;
let activeFilter = "all";
let autoSpin = false;
let orbitLine = null;
let selectedMarker = null;
let validPositionCount = 0;
let satelliteLayers = {};

const colors = {
  station: 0x51d9f4,
  starlink: 0xffdf70,
  gps: 0xa991ff,
  weather: 0x50e3a4,
  geo: 0xffb66d,
  oneweb: 0xff8c69,
  iridium: 0xd18cff,
  other: 0x83a4c9
};

const cities = [
  {name:"NEW YORK",country:"United States",lat:40.7128,lon:-74.0060,tz:"America/New_York"},
  {name:"LOS ANGELES",country:"United States",lat:34.0522,lon:-118.2437,tz:"America/Los_Angeles"},
  {name:"TORONTO",country:"Canada",lat:43.6532,lon:-79.3832,tz:"America/Toronto"},
  {name:"MEXICO CITY",country:"Mexico",lat:19.4326,lon:-99.1332,tz:"America/Mexico_City"},
  {name:"SAO PAULO",country:"Brazil",lat:-23.5505,lon:-46.6333,tz:"America/Sao_Paulo"},
  {name:"LONDON",country:"United Kingdom",lat:51.5072,lon:-0.1276,tz:"Europe/London"},
  {name:"PARIS",country:"France",lat:48.8566,lon:2.3522,tz:"Europe/Paris"},
  {name:"BERLIN",country:"Germany",lat:52.5200,lon:13.4050,tz:"Europe/Berlin"},
  {name:"CAIRO",country:"Egypt",lat:30.0444,lon:31.2357,tz:"Africa/Cairo"},
  {name:"DUBAI",country:"United Arab Emirates",lat:25.2048,lon:55.2708,tz:"Asia/Dubai"},
  {name:"DELHI",country:"India",lat:28.6139,lon:77.2090,tz:"Asia/Kolkata"},
  {name:"MUMBAI",country:"India",lat:19.0760,lon:72.8777,tz:"Asia/Kolkata"},
  {name:"SINGAPORE",country:"Singapore",lat:1.3521,lon:103.8198,tz:"Asia/Singapore"},
  {name:"BEIJING",country:"China",lat:39.9042,lon:116.4074,tz:"Asia/Shanghai"},
  {name:"TOKYO",country:"Japan",lat:35.6762,lon:139.6503,tz:"Asia/Tokyo"},
  {name:"SYDNEY",country:"Australia",lat:-33.8688,lon:151.2093,tz:"Australia/Sydney"}
];

function categoryFor(name, group = "") {
  const n = name.toUpperCase();
  const g = group.toLowerCase();

  if (
    g === "stations" ||
    n.includes("ISS") ||
    n.includes("TIANGONG")
  ) return "station";

  if (g === "starlink" || n.includes("STARLINK")) {
    return "starlink";
  }

  if (g === "oneweb" || n.includes("ONEWEB")) {
    return "oneweb";
  }

  if (
    g === "iridium-next" ||
    n.includes("IRIDIUM")
  ) return "iridium";

  if (
    g === "gps-ops" ||
    n.includes("GPS") ||
    n.includes("NAVSTAR")
  ) return "gps";

  if (
    g === "weather" ||
    g === "noaa" ||
    g === "goes" ||
    n.includes("WEATHER") ||
    n.includes("NOAA") ||
    n.includes("METEOR") ||
    n.includes("GOES")
  ) return "weather";

  if (
    g === "geo" ||
    n.includes("INTELSAT")
  ) return "geo";

  return "other";
}

/* One consistent coordinate system for the entire globe. */

function latLonVector(lat, lon, radius) {
  const latRad = THREE.MathUtils.degToRad(lat);
  const lonRad = THREE.MathUtils.degToRad(lon);

  return new THREE.Vector3(
    radius * Math.cos(latRad) * Math.cos(lonRad),
    radius * Math.sin(latRad),
    -radius * Math.cos(latRad) * Math.sin(lonRad)
  );
}

function satelliteLatLonVector(lat, lon, radius) {
  return latLonVector(lat, lon, radius);
}

/* THREE.JS SCENE */

function createScene() {
  const scene = new THREE.Scene();

  const camera = new THREE.PerspectiveCamera(42, 1, 0.1, 1000);
  camera.position.set(0, 0.4, 3.5);

  const renderer = new THREE.WebGLRenderer({
    canvas,
    antialias: true,
    alpha: true
  });

  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.outputColorSpace = THREE.SRGBColorSpace;

  const controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.055;
  controls.minDistance = 1.35;
  controls.maxDistance = 14;
  controls.autoRotate = false;
  controls.autoRotateSpeed = 0.35;

  scene.add(new THREE.AmbientLight(0x8299c0, 1.8));

  const sun = new THREE.DirectionalLight(0xffffff, 2.7);
  sun.position.set(5, 3, 5);
  scene.add(sun);

  const loader = new THREE.TextureLoader();

  const earthTexture = loader.load(
    "https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg",
    texture => {
      texture.colorSpace = THREE.SRGBColorSpace;
    },
    undefined,
    () => console.warn("Earth texture unavailable")
  );

  const earth = new THREE.Mesh(
    new THREE.SphereGeometry(1, 96, 96),
    new THREE.MeshStandardMaterial({
      map: earthTexture,
      roughness: 1,
      metalness: 0
    })
  );

  scene.add(earth);

  const atmosphere = new THREE.Mesh(
    new THREE.SphereGeometry(1.025, 64, 64),
    new THREE.MeshBasicMaterial({
      color: 0x329cff,
      transparent: true,
      opacity: 0.10,
      side: THREE.BackSide
    })
  );

  scene.add(atmosphere);

  const starPositions = [];

  for (let i = 0; i < 1800; i++) {
    const r = 35;
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos(2 * Math.random() - 1);

    starPositions.push(
      r * Math.sin(phi) * Math.cos(theta),
      r * Math.cos(phi),
      r * Math.sin(phi) * Math.sin(theta)
    );
  }

  const starGeometry = new THREE.BufferGeometry();

  starGeometry.setAttribute(
    "position",
    new THREE.Float32BufferAttribute(starPositions, 3)
  );

  scene.add(new THREE.Points(
    starGeometry,
    new THREE.PointsMaterial({
      color: 0xa8c7ed,
      size: 0.045
    })
  ));

  const satGroup = new THREE.Group();
  scene.add(satGroup);

  function resize() {
    const w = Math.max(1, canvas.clientWidth);
    const h = Math.max(1, canvas.clientHeight);

    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  }

  window.addEventListener("resize", resize);
  resize();

  function animate() {
    requestAnimationFrame(animate);

    controls.autoRotate = autoSpin;
    controls.update();

    renderer.render(scene, camera);
  }

  animate();

  return {
    scene,
    camera,
    renderer,
    controls,
    satGroup
  };
}

const world = createScene();

/* CITY MARKERS */

function makeCityMarkers() {
  const group = new THREE.Group();
  world.scene.add(group);

  for (const city of cities) {
    const marker = new THREE.Mesh(
      new THREE.SphereGeometry(0.012, 12, 12),
      new THREE.MeshBasicMaterial({color:0x51d9f4})
    );

    marker.position.copy(
      latLonVector(city.lat, city.lon, 1.012)
    );

    group.add(marker);

    const labelCanvas = document.createElement("canvas");
    labelCanvas.width = 512;
    labelCanvas.height = 96;

    const ctx = labelCanvas.getContext("2d");

    ctx.font = "bold 38px Arial";
    ctx.fillStyle = "#b9f2ff";
    ctx.shadowColor = "#000";
    ctx.shadowBlur = 8;
    ctx.fillText(city.name, 12, 58);

    const texture = new THREE.CanvasTexture(labelCanvas);

    const label = new THREE.Sprite(
      new THREE.SpriteMaterial({
        map: texture,
        transparent: true,
        depthTest: true
      })
    );

    label.position.copy(
      latLonVector(city.lat, city.lon, 1.045)
    );

    label.scale.set(0.24, 0.045, 1);
    group.add(label);
  }
}

makeCityMarkers();

/* TLE PARSING */

function parseTLE(text) {
  const lines = text
    .split(/\r?\n/)
    .map(s => s.trim())
    .filter(Boolean);

  const parsed = [];

  for (let i = 0; i < lines.length; i++) {
    if (
      lines[i].startsWith("1 ") &&
      lines[i + 1]?.startsWith("2 ")
    ) {
      const l1 = lines[i];
      const l2 = lines[i + 1];

      const name =
        i > 0 &&
        !lines[i - 1].startsWith("1 ") &&
        !lines[i - 1].startsWith("2 ")
          ? lines[i - 1]
          : "NORAD " + l1.slice(2, 7).trim();

      try {
        const satrec = satellite.twoline2satrec(l1, l2);

        if (satrec.error === 0) {
          parsed.push({
            name,
            l1,
            l2,
            satrec,
            category: categoryFor(name)
          });
        }
      } catch (error) {
        console.warn("Invalid TLE:", name, error);
      }

      i++;
    }
  }

  return parsed;
}

async function fetchGroup(group) {
  const url =
    `https://celestrak.org/NORAD/elements/gp.php?GROUP=${encodeURIComponent(group)}&FORMAT=tle`;

  const response = await fetch(url, {cache:"no-store"});

  if (!response.ok) {
    throw new Error(`${group}: HTTP ${response.status}`);
  }

  return parseTLE(await response.text());
}

/* BATCHED SATELLITE RENDERING */

function rebuildSatelliteLayers() {
  for (const layer of Object.values(satelliteLayers)) {
    world.satGroup.remove(layer);
    layer.geometry.dispose();
    layer.material.dispose();
  }

  satelliteLayers = {};

  const categories = {};

  for (const record of objects) {
    if (!categories[record.category]) {
      categories[record.category] = [];
    }

    categories[record.category].push(record);
  }

  for (const [category, records] of Object.entries(categories)) {
    const positions = new Float32Array(records.length * 3);

    const geometry = new THREE.BufferGeometry();

    geometry.setAttribute(
      "position",
      new THREE.BufferAttribute(positions, 3)
    );

    const material = new THREE.PointsMaterial({
      color: colors[category] || colors.other,
      size: 5.5,
      sizeAttenuation: false,
      transparent: true,
      opacity: 0.95,
      depthWrite: false
    });

    const points = new THREE.Points(geometry, material);

    points.frustumCulled = false;

    world.satGroup.add(points);

    satelliteLayers[category] = {
      points,
      geometry,
      records
    };

    records.forEach((record, index) => {
      record.layer = satelliteLayers[category];
      record.pointIndex = index;
    });
  }

  updatePositions();
}

function addObjects(records, source) {
  const existing = new Set(
    objects.map(o => o.l1.slice(2, 7))
  );

  let added = 0;

  for (const record of records) {
    const id = record.l1.slice(2, 7);

    if (existing.has(id)) continue;

    existing.add(id);

    record.source = source;
    record.category = categoryFor(record.name, source);

    objects.push(record);
    added++;
  }

  if (added) {
    rebuildSatelliteLayers();
  }

  return added;
}

/* ORBIT PROPAGATION */

function positionOf(record, date = new Date()) {
  try {
    const pv = satellite.propagate(record.satrec, date);

    if (
      !pv ||
      !pv.position ||
      typeof pv.position === "boolean"
    ) return null;

    const gmst = satellite.gstime(date);

    const geo = satellite.eciToGeodetic(
      pv.position,
      gmst
    );

    const lat = satellite.degreesLat(geo.latitude);
    const lon = satellite.degreesLong(geo.longitude);
    const altitude = geo.height;

    const velocity = Math.sqrt(
      pv.velocity.x ** 2 +
      pv.velocity.y ** 2 +
      pv.velocity.z ** 2
    );

    if (
      !Number.isFinite(lat) ||
      !Number.isFinite(lon) ||
      !Number.isFinite(altitude) ||
      !Number.isFinite(velocity)
    ) return null;

    return {
      lat,
      lon,
      altitude,
      velocity
    };
  } catch (error) {
    return null;
  }
}

function updatePositions() {
  const now = new Date();
  let valid = 0;

  for (const record of objects) {
    const p = positionOf(record, now);

    if (!p) {
      record.position = null;

      if (record.layer) {
        record.layer.geometry.attributes.position.setXYZ(
          record.pointIndex,
          0, 0, 0
        );
      }

      continue;
    }

    valid++;
    record.position = p;

    const radius = 1 + Math.max(0, p.altitude) / 6371;

    const vector = satelliteLatLonVector(
      p.lat,
      p.lon,
      radius
    );

    if (record.layer) {
      record.layer.geometry.attributes.position.setXYZ(
        record.pointIndex,
        vector.x,
        vector.y,
        vector.z
      );
    }
  }

  for (const layer of Object.values(satelliteLayers)) {
    layer.geometry.attributes.position.needsUpdate = true;
  }

  validPositionCount = valid;

  $("visibleCount").textContent = valid.toLocaleString();

  if (selected && selected.position) {
    $("topAltitude").textContent =
      Math.round(selected.position.altitude).toLocaleString() + " km";

    if (
      $("detail").dataset.id ===
      selected.l1.slice(2, 7).trim()
    ) {
      updateDetail(selected);
    }
  }

  updateSelectedMarker();
}

function updateSelectedMarker() {
  if (!selected || !selected.position) {
    if (selectedMarker) selectedMarker.visible = false;
    return;
  }

  if (!selectedMarker) {
    selectedMarker = new THREE.Mesh(
      new THREE.SphereGeometry(0.019, 16, 16),
      new THREE.MeshBasicMaterial({
        color: 0xffffff
      })
    );

    world.scene.add(selectedMarker);
  }

  const p = selected.position;
  const radius = 1 + Math.max(0, p.altitude) / 6371;

  selectedMarker.position.copy(
    satelliteLatLonVector(p.lat, p.lon, radius)
  );

  selectedMarker.visible = true;
}

function updateCounts() {
  $("totalCount").textContent =
    objects.length.toLocaleString();

  $("visibleCount").textContent =
    validPositionCount.toLocaleString();
}

/* OBJECT CATALOG */

function renderList() {
  const query = $("search").value.trim().toLowerCase();

  const filtered = objects.filter(o => {
    const matches =
      o.name.toLowerCase().includes(query) ||
      o.l1.slice(2, 7).includes(query);

    return matches &&
      (activeFilter === "all" || o.category === activeFilter);
  }).slice(0, 250);

  if (!filtered.length) {
    $("satList").innerHTML =
      '<div class="loading">NO MATCHING OBJECTS</div>';
    return;
  }

  $("satList").innerHTML = "";

  for (const o of filtered) {
    const row = document.createElement("div");

    row.className =
      "sat-row" + (selected === o ? " selected" : "");

    const hex = (colors[o.category] || colors.other)
      .toString(16)
      .padStart(6, "0");

    const altitude = o.position
      ? Math.round(o.position.altitude).toLocaleString() + " km"
      : "Calculating";

    row.innerHTML = `
      <span class="dot"
        style="background:#${hex};color:#${hex}"></span>
      <div class="sat-info">
        <div class="sat-name"></div>
        <div class="sat-meta">
          NORAD ${o.l1.slice(2,7).trim()} · ${o.category.toUpperCase()}
        </div>
      </div>
      <div class="sat-alt">${altitude}</div>
    `;

    row.querySelector(".sat-name").textContent = o.name;

    row.addEventListener("click", () => selectObject(o));

    $("satList").appendChild(row);
  }
}

function updateDetail(o) {
  const p = o.position;
  if (!p) return;

  const id = o.l1.slice(2, 7).trim();

  const inclination = Number(
    o.l2.slice(8, 16)
  ).toFixed(2);

  const hex = (colors[o.category] || colors.other)
    .toString(16)
    .padStart(6, "0");

  $("detail").dataset.id = id;

  $("detail").innerHTML = `
    <div class="detail-head">
      <div>
        <div class="detail-name"></div>
        <div class="detail-id">
          NORAD ${id} · ${o.source || "IMPORTED"}
        </div>
      </div>
      <span class="dot" style="background:#${hex}"></span>
    </div>

    <div class="detail-grid">
      <div class="detail-item">
        <label>ALTITUDE</label>
        <strong>${p.altitude.toFixed(1)} km</strong>
      </div>

      <div class="detail-item">
        <label>VELOCITY</label>
        <strong>${p.velocity.toFixed(2)} km/s</strong>
      </div>

      <div class="detail-item">
        <label>LATITUDE</label>
        <strong>${p.lat.toFixed(2)}°</strong>
      </div>

      <div class="detail-item">
        <label>LONGITUDE</label>
        <strong>${p.lon.toFixed(2)}°</strong>
      </div>

      <div class="detail-item">
        <label>INCLINATION</label>
        <strong>${inclination}°</strong>
      </div>

      <div class="detail-item">
        <label>ORBIT CLASS</label>
        <strong>
          ${p.altitude < 2000 ? "LEO" :
            p.altitude < 30000 ? "MEO" : "HIGH ORBIT"}
        </strong>
      </div>
    </div>

    <button class="action-btn" id="showOrbit"
      style="width:100%;margin-top:15px">
      SHOW ORBITAL PATH
    </button>
  `;

  $("detail").querySelector(".detail-name").textContent = o.name;

  $("showOrbit").addEventListener(
    "click",
    () => showOrbit(o)
  );
}

function selectObject(o) {
  selected = o;

  if (!o.position) {
    o.position = positionOf(o, new Date());
  }

  renderList();
  updateDetail(o);
  updateSelectedMarker();

  $("topAltitude").textContent = o.position
    ? Math.round(o.position.altitude).toLocaleString() + " km"
    : "—";
}

/* ORBITAL PATH */

function showOrbit(o) {
  if (orbitLine) {
    world.scene.remove(orbitLine);
    orbitLine.geometry.dispose();
    orbitLine.material.dispose();
    orbitLine = null;
  }

  const points = [];
  const start = new Date();

  for (let i = 0; i <= 90; i++) {
    const time = new Date(
      start.getTime() + i * 60000
    );

    const p = positionOf(o, time);

    if (p) {
      const radius = 1 + Math.max(0, p.altitude) / 6371;

      points.push(
        satelliteLatLonVector(p.lat, p.lon, radius)
      );
    }
  }

  if (points.length < 2) return;

  const geometry = new THREE.BufferGeometry()
    .setFromPoints(points);

  orbitLine = new THREE.Line(
    geometry,
    new THREE.LineBasicMaterial({
      color: colors[o.category] || colors.other,
      transparent: true,
      opacity: 0.9
    })
  );

  world.scene.add(orbitLine);
}

/* LIVE CELESTRAK DATA */

async function loadLiveData() {
  $("feedStatus").textContent = "FETCHING FEEDS";
  $("liveLabel").textContent = "CONNECTING";
  $("feedDot").classList.remove("ok");

  const groups = [
    "stations",
    "starlink",
    "oneweb",
    "iridium-NEXT",
    "orbcomm",
    "globalstar",
    "gps-ops",
    "weather",
    "geo",
    "science",
    "amateur"
  ];

  let success = 0;
  let addedTotal = 0;

  const errors = [];

  /*
    Use a small concurrency limit so the browser
    does not launch every request simultaneously.
  */

  let nextIndex = 0;

  async function worker() {
    while (nextIndex < groups.length) {
      const index = nextIndex++;
      const group = groups[index];

      try {
        const records = await fetchGroup(group);

        addedTotal += addObjects(records, group);
        success++;
      } catch (error) {
        console.warn("Feed unavailable:", group, error);
        errors.push(group);
      }
    }
  }

  await Promise.all([
    worker(),
    worker(),
    worker()
  ]);

  const now = new Date();

  $("lastUpdate").textContent = success
    ? now.toLocaleTimeString([], {
        hour: "2-digit",
        minute: "2-digit"
      })
    : "Unavailable";

  $("dataSource").textContent = success
    ? `${success}/${groups.length} feeds · +${addedTotal} new`
    : "No live feeds received";

  $("feedStatus").textContent = success
    ? (errors.length ? "PARTIAL DATA" : "FEEDS CONNECTED")
    : "FEED UNAVAILABLE";

  $("feedDot").classList.toggle("ok", success > 0);

  $("liveLabel").textContent = success
    ? (errors.length ? "PARTIAL DATA" : "DATA CONNECTED")
    : "OFFLINE";

  updatePositions();
  updateCounts();
  renderList();

  if (!selected && objects.length) {
    selectObject(objects[0]);
  }

  if (!success && !objects.length) {
    $("satList").innerHTML =
      '<div class="loading">LIVE DATA UNAVAILABLE.<br>Check your connection and reload the page.</div>';
  }
}

/* NOAA SPACE WEATHER */

async function loadSpaceWeather() {
  const endpoints = {
    plasma:
      "https://services.swpc.noaa.gov/products/solar-wind/plasma-7-day.json",

    kp:
      "https://services.swpc.noaa.gov/products/noaa-planetary-k-index.json"
  };

  try {
    const response = await fetch(
      endpoints.plasma,
      {cache:"no-store"}
    );

    if (!response.ok) {
      throw new Error("Plasma feed unavailable");
    }

    const rows = await response.json();

    const latest = rows.slice(1).reverse().find(r =>
      r[1] &&
      r[2] &&
      Number.isFinite(Number(r[1])) &&
      Number.isFinite(Number(r[2]))
    );

    if (latest) {
      $("solarDensity").textContent =
        Number(latest[1]).toFixed(1) + " /cm³";

      $("solarSpeed").textContent =
        Math.round(Number(latest[2])) + " km/s";

      $("solarDensityNote").textContent =
        "Latest available NOAA plasma measurement";

      $("solarSpeedNote").textContent =
        "Latest available NOAA plasma measurement";
    }
  } catch (error) {
    console.warn("Solar wind data unavailable", error);

    $("solarSpeedNote").textContent =
      "NOAA data currently unavailable";

    $("solarDensityNote").textContent =
      "NOAA data currently unavailable";
  }

  try {
    const response = await fetch(
      endpoints.kp,
      {cache:"no-store"}
    );

    if (!response.ok) {
      throw new Error("K-index feed unavailable");
    }

    const rows = await response.json();

    const latest = rows.slice(1).reverse().find(r =>
      r[1] &&
      Number.isFinite(Number(r[1]))
    );

    if (latest) {
      const kp = Number(latest[1]);

      $("kpIndex").textContent = kp.toFixed(1);
      $("kpNote").textContent =
        "Latest planetary K-index · NOAA";
    }
  } catch (error) {
    console.warn("K-index data unavailable", error);

    $("kpNote").textContent =
      "NOAA data currently unavailable";
  }
}

/* SEARCH AND FILTERS */

$("search").addEventListener("input", renderList);

document.querySelectorAll(".filter").forEach(button => {
  button.addEventListener("click", () => {
    document.querySelectorAll(".filter").forEach(b =>
      b.classList.remove("active")
    );

    button.classList.add("active");
    activeFilter = button.dataset.filter;

    renderList();
  });
});

/* GLOBE CONTROLS */

$("resetView").addEventListener("click", () => {
  world.controls.reset();

  if (orbitLine) {
    world.scene.remove(orbitLine);
    orbitLine.geometry.dispose();
    orbitLine.material.dispose();
    orbitLine = null;
  }
});

$("toggleSpin").addEventListener("click", () => {
  autoSpin = !autoSpin;

  $("toggleSpin").textContent =
    `AUTO ROTATE: ${autoSpin ? "ON" : "OFF"}`;
});

/* WEATHER REFRESH */

$("refreshWeather").addEventListener(
  "click",
  loadSpaceWeather
);

/* IMPORT TLE FILES */

$("tleUpload").addEventListener("change", async e => {
  const file = e.target.files[0];

  if (!file) return;

  try {
    const records = parseTLE(await file.text());

    const added = addObjects(records, "user import");

    $("dataSource").textContent =
      `${added} imported from ${file.name}`;

    $("lastUpdate").textContent = "Imported";

    updatePositions();
    updateCounts();
    renderList();

    if (added && !selected) {
      selectObject(objects[0]);
    }

    if (!added) {
      alert("No valid standard TLE records were found.");
    }
  } catch (error) {
    console.error("TLE import failed:", error);
    alert("Could not read that TLE file.");
  }

  e.target.value = "";
});

/* WORLD CLOCKS */

function updateClocks() {
  const now = new Date();

  $("headerUtc").textContent =
    "UTC " + now.toISOString().slice(11, 19);

  $("clocks").innerHTML = "";

  for (const city of cities) {
    const time = new Intl.DateTimeFormat("en-GB", {
      timeZone: city.tz,
      hour: "2-digit",
      minute: "2-digit",
      second: "2-digit",
      hour12: false
    }).format(now);

    const date = new Intl.DateTimeFormat("en-US", {
      timeZone: city.tz,
      weekday: "short",
      month: "short",
      day: "numeric"
    }).format(now);

    const card = document.createElement("div");
    card.className = "clock";

    card.innerHTML = `
      <div class="clock-city"></div>
      <div class="clock-country"></div>
      <div class="clock-time">${time}</div>
      <div class="clock-date">${date}</div>
    `;

    card.querySelector(".clock-city").textContent =
      city.name;

    card.querySelector(".clock-country").textContent =
      city.country;

    $("clocks").appendChild(card);
  }
}

/* INITIALIZATION */

updateClocks();
updatePositions();
updateCounts();

loadLiveData();
loadSpaceWeather();

setInterval(updateClocks, 1000);
setInterval(updatePositions, 5000);
setInterval(renderList, 15000);

setInterval(loadLiveData, 30 * 60 * 1000);
setInterval(loadSpaceWeather, 10 * 60 * 1000);

</script>
